[project]
name = "aibasics"
version = "0.10.1"
description = "AI Uncovered: A Comprehensive Guide to AI Basics and Applications"
authors = [{ name = "Young Joon Lee", email = "yj.lee@chu.ac.kr" }]
license = "CC-BY-4.0"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Course dependencies installed by `%pip install aibasics` in the labs.
dependencies = ["click>=8.1", "scikit-learn>=1.4", "seaborn>=0.13"]

[project.urls]
Homepage = "https://aibasics.jeju.ai"
Repository = "https://github.com/entelecheia/aibasics"
Changelog = "https://github.com/entelecheia/aibasics/blob/main/CHANGELOG.md"

[project.scripts]
aibasics = "aibasics.__cli__:main"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.15"]
# pip: the labs run `%pip install`, which needs it in the kernel env.
notebook = ["pip"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "notebook" }]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibasics"]

# Keep book/ (notebooks, media) out of the sdist; PyPI caps files at 100 MB.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["book"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["aibasics"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", 'if __name__ == "__main__":']

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_source = "tag"
commit_message = ":rocket: {version}\n\nAutomatically generated by python-semantic-release"
build_command = "pip install uv==0.13.1 && uv lock --upgrade-package \"$PACKAGE_NAME\" && git add uv.lock && uv build"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/aibasics/_version.py:__version__"]

[tool.semantic_release.branches.main]
match = "release"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!--next-version-placeholder-->"
mode = "update"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
